services:
  redis:
    image: redis
    command: redis-server --save 60 1 --loglevel warning
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: django-docker
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./core:/app
    depends_on:
      - redis
      - db

  db:
    image: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env
    ports:
      - "5432:5432"

  worker:
    build: .
    command: celery -A core worker --loglevel=info
    env_file:
      - .env
    volumes:
      - ./core:/app
    depends_on:
      - redis
      - backend

volumes:
  postgres_data: